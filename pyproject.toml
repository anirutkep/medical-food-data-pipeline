[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-food-data-pipeline-skill"
version = "0.1.1"
description = "Dual-agent skill and automation pipeline for medical food and enteral nutrition products compliant with Thai FDA MOPH Notification No. 445."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anirut Kepan, RD"}
]
keywords = [
    "medical-food",
    "enteral-nutrition",
    "thai-fda",
    "moph-445",
    "openpyxl",
    "agent-skills"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
ocr = [
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/anirutkep/medical-food-data-pipeline"
Repository = "https://github.com/anirutkep/medical-food-data-pipeline"
"Issue Tracker" = "https://github.com/anirutkep/medical-food-data-pipeline/issues"
